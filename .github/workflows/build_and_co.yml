name: Build and Release GeoWeather

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.versioncheck.outputs.version }}
      create_tag: ${{ steps.versioncheck.outputs.create_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version & create tag
        id: versioncheck
        run: |
          VERSION=$(grep 'versionName' androidApp/build.gradle.kts \
            | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          git fetch --tags

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

  build_android:
    needs: prepare_release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Keystore Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.KEYSTORE_REPOSITORY }}
          token: ${{ secrets.KEYSTORE_ACCESS_TOKEN }}
          path: keystore

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Android build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Show build environment
        run: |
          java -version
          ./gradlew --version
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"

      - name: Build Android App (Release)
        run: |
          ./gradlew \
            --no-daemon \
            :androidApp:assembleRelease

      - name: Configure APKSIGNER
        id: find_apksigner
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "Error: apksigner not found at $APKSIGNER"
            exit 1
          fi

          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"
          "$APKSIGNER" version

      - name: Sign Android APK
        id: sign_apk
        run: |
          UNSIGNED_APK="androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk"
          SIGNED_APK="GeoWeather-v${{ needs.prepare_release.outputs.version }}.apk"
          KEYSTORE_PATH="./keystore/GeoWeather-KeyStore.jks"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Error: APK not found: $UNSIGNED_APK"
            exit 1
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Error: Keystore not found: $KEYSTORE_PATH"
            exit 1
          fi

          "${{ steps.find_apksigner.outputs.apksigner }}" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias alle \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK Signature
        run: |
          "${{ steps.find_apksigner.outputs.apksigner }}" \
            verify \
            --verbose \
            --print-certs \
            "${{ steps.sign_apk.outputs.signed_apk }}"

      - name: Show APK checksum
        run: |
          sha256sum "${{ steps.sign_apk.outputs.signed_apk }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GeoWeather-v${{ needs.prepare_release.outputs.version }}.apk
          path: GeoWeather-v${{ needs.prepare_release.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90

  release:
    needs:
      - prepare_release
      - build_android

    if: needs.prepare_release.outputs.create_tag == 'true'

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Android Artifact
        uses: actions/download-artifact@v8
        with:
          pattern: GeoWeather-v${{ needs.prepare_release.outputs.version }}.apk
          path: ./dist
          merge-multiple: true

      - name: Show release files
        run: |
          find ./dist -type f -maxdepth 2 -print

      - name: Create release notes
        run: |
          {
            echo "## What's new"
            echo ""
            cat fastlane/metadata/android/en-US/changelogs/default.txt
          } > release-notes.md

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare_release.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/*.apk
          draft: false
          generate_release_notes: true
