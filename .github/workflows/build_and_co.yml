name: Build and Release GeoWeather

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioncheck.outputs.version }}
      create_tag: ${{ steps.versioncheck.outputs.create_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect version & create tag
        id: versioncheck
        run: |
          # Use androidApp for version detection
          VERSION=$(grep 'versionName' androidApp/build.gradle.kts | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          git fetch --tags

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

  build_all:
    needs: prepare_release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Keystore Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.KEYSTORE_REPOSITORY }}
          token: ${{ secrets.KEYSTORE_ACCESS_TOKEN }}
          path: keystore

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build SDK
        run: ./gradlew :SDK:SDK:assemble

      - name: Build Android App (Release)
        run: ./gradlew :androidApp:assembleRelease

      - name: Build Desktop App (Release)
        # assembleDistributable creates the platform-specific package
        run: ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS

      - name: Find APKSIGNER
        id: find_apksigner
        run: |
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner | head -n 1)
          echo "apksigner=$APKSIGNER" >> $GITHUB_OUTPUT

      - name: Sign Android APK
        id: sign_apk
        run: |
          UNSIGNED_APK="androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk"
          SIGNED_APK="GeoWeather-v${{ needs.prepare_release.outputs.version }}-android.apk"
          KEYSTORE_PATH="./keystore/GeoWeather-KeyStore.jks"

          echo "==> Signiere APK: $SIGNED_APK"
          "${{ steps.find_apksigner.outputs.apksigner }}" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias alle \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          echo "signed_apk=$SIGNED_APK" >> $GITHUB_OUTPUT

      - name: Verify APK Signature
        run: |
          "${{ steps.find_apksigner.outputs.apksigner }}" verify --verbose \
            "${{ steps.sign_apk.outputs.signed_apk }}"

      - name: Prepare Desktop Artifact
        run: |
          # Move the desktop output to a predictable location
          # Usually in desktopApp/build/compose/binaries/main/deb (or similar on linux)
          # Since we run on ubuntu-latest, we look for deb or tar.gz
          DIST_DIR="desktopApp/build/compose/binaries/main"
          DEB_FILE=$(find $DIST_DIR -name "*.deb" | head -n 1)
          if [ -f "$DEB_FILE" ]; then
            cp "$DEB_FILE" "GeoWeather-v${{ needs.prepare_release.outputs.version }}-linux.deb"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GeoWeather-Builds
          path: |
            *.apk
            *.deb
          if-no-files-found: warn
          retention-days: 90

      - name: Create Release and Upload Assets
        if: needs.prepare_release.outputs.create_tag == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare_release.outputs.version }}
          files: |
            *.apk
            *.deb
          draft: false
          generate_release_notes: true
