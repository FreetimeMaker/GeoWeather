name: Build, Sign and Release Android App

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  prepare_android_app:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioncheck.outputs.version }}
      create_tag: ${{ steps.versioncheck.outputs.create_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Detect version and tag status
        id: versioncheck
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          git fetch --tags

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

  build_sign_and_release_android_app:
    needs: prepare_android_app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Checkout Keystore Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.KEYSTORE_REPOSITORY }}
          token: ${{ secrets.KEYSTORE_ACCESS_TOKEN }}
          path: keystore

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android App
        run: ./gradlew :app:assembleRelease

      - name: Install Android Build Tools 34.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n1)"
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "build-tools;34.0.0"

      - name: Use APKSIGNER 34.0.0
        id: find_apksigner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" version
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"

      - name: Sign Android
        id: sign_apk
        run: |
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="GeoWeather-v${{ needs.prepare_android_app.outputs.version }}.apk"
          KEYSTORE_PATH="./keystore/GeoWeather-KeyStore.jks"

          echo "==> Signiere APK: $SIGNED_APK"
          "${{ steps.find_apksigner.outputs.apksigner }}" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias alle \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK Signature
        run: |
          echo "==> Überprüfe Signatur"
          "${{ steps.find_apksigner.outputs.apksigner }}" verify --verbose \
            "${{ steps.sign_apk.outputs.signed_apk }}"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: GeoWeather-v${{ needs.prepare_android_app.outputs.version }}.apk
          path: GeoWeather-v${{ needs.prepare_android_app.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create and push tag
        if: needs.prepare_android_app.outputs.create_tag == 'true'
        env:
          VERSION: ${{ needs.prepare_android_app.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "GeoWeather v$VERSION"
          git push origin "v$VERSION"

      - name: Create release notes
        run: |
          {
            echo "## What's new"
            echo ""
            cat fastlane/metadata/android/en-US/changelogs/default.txt
          } > release-notes.md

      - name: Upload APK to Release
        if: needs.prepare_android_app.outputs.create_tag == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare_android_app.outputs.version }}
          name: GeoWeather v${{ needs.prepare_android_app.outputs.version }}
          body_path: release-notes.md
          files: |
            GeoWeather-v${{ needs.prepare_android_app.outputs.version }}.apk
          draft: false
          generate_release_notes: true
